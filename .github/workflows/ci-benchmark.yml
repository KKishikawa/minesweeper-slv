name: CI benchmark

on:
  workflow_dispatch:
    inputs:
      condition:
        description: A baseline serial, B changed serial, C changed grouped
        required: true
        type: choice
        options: [A, B, C]
      after_sha:
        description: Full 40-character commit SHA used identically by B and C
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-benchmark-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      condition: ${{ steps.inputs.outputs.condition }}
      target_sha: ${{ steps.inputs.outputs.target_sha }}
    steps:
      - name: Validate fixed benchmark refs
        id: inputs
        env:
          CONDITION: ${{ inputs.condition }}
          AFTER_SHA: ${{ inputs.after_sha }}
        shell: bash
        run: |
          [[ ${#CONDITION} -eq 1 && "$CONDITION" =~ ^[ABC]$ ]] || { echo 'condition must be A, B, or C' >&2; exit 1; }
          [[ ${#AFTER_SHA} -eq 40 && "$AFTER_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { echo 'after_sha must be a full 40-character hexadecimal SHA' >&2; exit 1; }
          target_sha="$AFTER_SHA"
          if [[ "$CONDITION" == A ]]; then target_sha=1a01eac18f389e7933be9937ad7fa4aa8be476b7; fi
          printf 'condition=%s\ntarget_sha=%s\n' "$CONDITION" "$target_sha" >> "$GITHUB_OUTPUT"

  serial:
    name: Serial / ${{ needs.validate.outputs.condition }}
    needs: validate
    if: needs.validate.outputs.condition != 'C'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: target
    steps:
      - name: Check out benchmark control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out fixed target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          path: target
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: target/.node-version
          cache: npm
          cache-dependency-path: target/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run type checking
        run: npm run typecheck
      - name: Build production app
        run: npm run build
      - name: Run unchanged target full regression with external timing recorder
        env:
          CI_CONTROL_SHA: ${{ github.sha }}
          CI_BENCHMARK_CONDITION: ${{ needs.validate.outputs.condition }}
        run: node node_modules/tsx/dist/cli.mjs "$GITHUB_WORKSPACE/control/scripts/ci/run-tests.ts" --external-all "$GITHUB_WORKSPACE/target"
      - name: Save serial timing records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ needs.validate.outputs.condition }}-all
          path: target/test/artifacts/ci/all/
          if-no-files-found: error

  regression:
    name: Grouped / ${{ matrix.group }}
    needs: validate
    if: needs.validate.outputs.condition == 'C'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [product, formal, holdout, grid-compatibility, recognition]
    steps:
      - name: Check out fixed target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run type checking
        if: matrix.group == 'product'
        run: npm run typecheck
      - name: Build production app
        if: matrix.group == 'product'
        run: npm run build
      - name: Run isolated regression group
        env:
          CI_CONTROL_SHA: ${{ github.sha }}
          CI_BENCHMARK_CONDITION: C
        run: npm run test:ci -- ${{ matrix.group }}
      - name: Save grouped timing records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-C-${{ matrix.group }}
          path: test/artifacts/ci/${{ matrix.group }}/
          if-no-files-found: error

  quality:
    name: Benchmark / quality
    if: always() && needs.validate.outputs.condition == 'C'
    needs: [validate, regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out fixed target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require every grouped regression job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node node_modules/tsx/dist/cli.mjs --eval "import { allJobsSucceeded } from './scripts/ci/quality-result.ts'; const needs = JSON.parse(process.env.CI_NEEDS); const results = { regression: needs.regression.result }; process.exitCode = needs.validate.result === 'success' && allJobsSucceeded(results, ['regression']) ? 0 : 1;"
